# --------------------------------------
# Hexo Butterfly 主题配置
# 如果有任何问题，请参考文档
# 中文: https://butterfly.js.org/
# 英文: https://butterfly.js.org/en/
# --------------------------------------

# --------------------------------------
# 导航设置
# --------------------------------------

nav:
  # 导航栏 Logo 图片
  logo:
  display_title: true
  display_post_title: true
  # 是否固定导航栏
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  友链: /link/ || fas fa-link
  留言板: /message/ || fas fa-comment-dots
  关于: /about/ || fas fa-user

# --------------------------------------
# 代码块设置
# --------------------------------------

code_blocks:
  # 代码块主题: darker / pale night / light / ocean / false
  theme: light
  macStyle: false
  # 代码块高度限制 (单位: px)
  height_limit: false
  word_wrap: false

  # 工具栏
  copy: true
  language: true
  # true: 折叠代码块 | false: 展开代码块 | none: 展开代码块并隐藏按钮
  shrink: false
  fullpage: false

# 社交媒体链接
# 格式:
#   图标: 链接 || 描述 || 颜色
social:
  # fab fa-github: https://github.com/lty-041010 || Github || '#24292e'
  # fas fa-envelope: mailto:1373422192@qq.com || Email || '#4a7dbe'

# --------------------------------------
# 图片设置
# --------------------------------------

# 网站图标
favicon: /img/111.jpg

avatar:
  # 头像图片
  img: /img/111.jpg
  effect: false

# 禁用所有顶部图
disable_top_img: false

# 如果页面没有设置顶部图，将显示默认顶部图
default_top_img:

# 首页顶部图
index_img:

# 归档页顶部图
archive_img:

# 注意: 是标签页，不是标签页们
tag_img:

# 标签页的顶部图，你可以为每个标签设置顶部图
# 格式:
#  - 标签名: 图片链接
tag_per_img:

# 注意: 是分类页，不是分类页们
category_img:

# 分类页的顶部图，你可以为每个分类设置顶部图
# 格式:
#  - 分类名: 图片链接
category_per_img:

# 页脚背景图
footer_img: false

# 网站背景
# 可以设置为颜色、图片 URL 或包含颜色和/或图片 URL 的数组
# 如果提供数组，每次加载将从数组中随机选择一张背景
background:

cover:
  # 是否在首页显示封面
  index_enable: true
  # 是否在侧边栏显示封面
  aside_enable: true
  # 是否在归档页显示封面
  archives_enable: true
  # 如果没有设置封面，将显示默认封面
  default_cover:
    - https://uapis.cn/api/v1/random/image?category=landscape
    - https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=800&auto=format&fit=crop
    - https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=800&auto=format&fit=crop

# 替换失效图片
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# 简单的 404 页面
error_404:
  enable: false
  subtitle: '页面未找到'
  background: /img/error-page.png

post_meta:
  # 首页
  page:
    # 选择: created (创建时间) / updated (更新时间) / both (两者)
    date_type: created
    # 选择: date (日期) / relative (相对时间)
    date_format: date
    categories: true
    tags: false
    label: true
  # 文章页
  post:
    # 选择: left (左对齐) / center (居中)
    position: left
    # 选择: created (创建时间) / updated (更新时间) / both (两者)
    date_type: both
    # 选择: date (日期) / relative (相对时间)
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# 首页设置
# --------------------------------------

# 首页顶部图设置
# 默认: 顶部图 - 全屏，站点信息 - 居中
# 站点信息位置，例如: 300px/300em/300rem/10%
index_site_info_top:
# 顶部图高度，例如: 300px/300em/300rem
index_top_img_height: 100vh

# 首页副标题
subtitle:
  enable: true
  # 打字机效果
  effect: true
  # 自定义打字机效果
  # https://github.com/mattboldt/typed.js/#customization
  typed_option:
    typeSpeed: 100      # 打字速度
    backSpeed: 50       # 退格速度
    backDelay: 2000     # 停留 2 秒后才开始退格
    # loop: true          # 循环播放
  # 来源 - 调用第三方服务 API (仅限中文)
  # 它会先显示来源，再显示 sub 的内容
  # 选择: false/1/2/3
  # false - 禁用此功能
  # 1 - hitokoto.cn (一言)
  # 2 - https://api.aa1.cn/doc/yiyan.html
  # 3 - jinrishici.com (今日诗词)
  source: 1
  # 如果你关闭了打字机效果，副标题将只显示 sub 的第一行
  sub:


# 首页文章布局
# 1: 封面在左，信息在右
# 2: 封面在右，信息在左
# 3: 封面和信息左右交替
# 4: 封面在上，信息在下
# 5: 信息显示在封面上
# 6: 瀑布流布局 - 封面在上，信息在下
# 7: 瀑布流布局 - 信息显示在封面上
index_layout: 3

# 在首页显示文章简介
# 1: 描述
# 2: 两者 (如果存在描述，则显示描述，否则显示自动摘要)
# 3: 自动摘要 (默认)
# false: 不显示文章简介
index_post_content:
  method: 3
  # 如果你设置 method 为 2 或 3，需要配置长度
  length: 500

# --------------------------------------
# 文章设置
# --------------------------------------

toc:
  post: true
  page: false
  number: true
  expand: false
  # 仅用于文章
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 赞赏
reward:
  enable: false
  text:
  QR_code:
    # - img: /img/wechat.jpg
    #   link:
    #   text: wechat
    # - img: /img/alipay.jpg
    #   link:
    #   text: alipay

# 文章编辑
# 轻松在线浏览和编辑博客源代码。
post_edit:
  enable: false
  # url: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/
  # 例如: https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  url:

# 相关文章
related_post:
  enable: true
  # 显示的文章数量
  limit: 6
  # 选择: created (创建时间) / updated (更新时间)
  date_type: created

# 选择: 1 / 2 / false
# 1: '下一篇' 将链接到旧文章
# 2: '下一篇' 将链接到新文章
# false: 禁用分页
post_pagination: 1

# 为文章显示过期提醒
noticeOutdate:
  enable: false
  # 样式: simple / flat
  style: flat
  # 何时显示
  limit_day: 365
  # 位置: top / bottom
  position: top
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

# --------------------------------------
# 页脚设置
# --------------------------------------
footer:
  nav:
  owner:
    enable: true
    since: 
  # 主题和框架的版权
  copyright:
    enable: true
    version: true
  custom_text:

# --------------------------------------
# 侧边栏设置
# --------------------------------------

aside:
  enable: true
  hide: false
  # 在右下角按钮中显示隐藏侧边栏的按钮
  button: true
  mobile: true
  # 位置: left / right
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description:
    button:
      enable: true
      icon: fab fa-github
      text: GitHub 主页
      link: https://github.com/lty-041010
  card_announcement:
    enable: true
    content: 暂无公告
  card_recent_post:
    enable: true
    # 如果设置为 0 将显示全部
    limit: 5
    # 排序: date / updated
    sort: date
    sort_order:
  card_newest_comments:
    enable: false
    sort_order:
    limit: 6
    # 单位: 分钟，将数据保存到 localStorage
    storage: 10
    avatar: true
  card_categories:
    enable: true
    # 如果设置为 0 将显示全部
    limit: 8
    # 选择: none / true / false
    expand: none
    sort_order:
  card_tags:
    enable: true
    # 如果设置为 0 将显示全部
    limit: 40
    color: false
    custom_colors:
    # 标签排序: random (随机) / name (名称) / length (长度)
    orderby: random
    # 排序顺序: 1 (升序), -1 (降序)
    order: 1
    sort_order:
  card_archives:
    enable: true
    # 类型: monthly (按月) / yearly (按年)
    type: monthly
    # 例如: YYYY年MM月
    format: MMMM YYYY
    # 排序顺序: 1 (升序), -1 (降序)
    order: -1
    # 如果设置为 0 将显示全部
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    # 标题显示系列名称
    series_title: false
    # 按标题或日期排序
    orderBy: 'date'
    # 排序顺序: 1 (升序), -1 (降序)
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    # 发布日期与现在的时间差
    # 格式: 月/日/年 时间 或 年/月/日 时间
    # 如果不启用此功能，请留空
    runtime_date: 10/19/2026 00:00:00

# --------------------------------------
# 右下角按钮
# --------------------------------------

# 右下角按钮与底部的距离 (默认单位: px)
rightside_bottom:

# 繁体与简体中文转换
translate:
  enable: false
  # 按钮文本
  default: 繁
  # 网站语言 (1 - 繁体中文 / 2 - 简体中文)
  defaultEncoding: 2
  # 时间延迟
  translateDelay: 0
  # 当语言为简体中文时的按钮文本
  msgToTraditionalChinese: '繁'
  # 当语言为繁体中文时的按钮文本
  msgToSimplifiedChinese: '簡'

# 阅读模式
readmode: true

# 深色模式
darkmode:
  enable: true
  # 切换深色/浅色模式的按钮
  button: true
  # 自动切换深色/浅色模式
  # autoChangeMode: 1  跟随系统设置，如果系统不支持深色模式，将在晚上 6 点到早上 6 点之间切换深色模式
  # autoChangeMode: 2  在晚上 6 点到早上 6 点之间切换深色模式
  # autoChangeMode: false (关闭)
  autoChangeMode: false
  # 设置浅色模式时间。值在 0 到 24 之间。如果未设置，默认值为 6 和 18
  start:
  end:

# 在返回顶部按钮中显示滚动百分比
rightside_scroll_percent: false

# 除非你知道它们如何工作，否则不要修改以下设置
# 选择: readmode,translate,darkmode,hideAside,toc,chat,comment
# 不要重复相同的值
rightside_item_order:
  enable: false
  # 默认: readmode,translate,darkmode,hideAside
  hide:
  # 默认: toc,chat,comment
  show:

# 右下角配置按钮动画
rightside_config_animation: true

# --------------------------------------
# 全局设置
# --------------------------------------

anchor:
  # 滚动时，URL 将根据标题 id 更新。
  auto_update: false
  # 点击标题滚动并更新锚点
  click_to_scroll: false

photofigcaption: false

copy:
  enable: true
  # 在复制内容后添加版权信息
  copyright:
    enable: false
    limit_count: 150

# 需要安装 hexo-wordcount 插件
wordcount:
  enable: false
  # 在文章 meta 中显示文章字数
  post_wordcount: true
  # 在文章 meta 中显示阅读文章所需时间
  min2read: true
  # 在侧边栏的 webinfo 中显示网站总字数
  total_wordcount: true

# 用于站点 PV / UV 的不蒜子计数
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# --------------------------------------
# 数学公式
# --------------------------------------

# 关于 per_page
# 如果你将其设置为 true，它将在每个页面中加载 mathjax/katex 脚本
# 如果你将其设置为 false，它将根据你的设置加载 mathjax/katex 脚本 (在页面的 front-matter 中添加 'mathjax: true' 或 'katex: true')
math:
  # 选择: mathjax, katex
  # 如果你不需要数学公式，请留空
  use:
  per_page: true
  hide_scrollbar: false

  mathjax:
    # 启用上下文菜单
    enableMenu: true
    # 选择: all / ams / none，控制方程是否编号以及如何编号
    tags: none

  katex:
    # 启用复制 KaTeX 公式
    copy_tex: false

# --------------------------------------
# 搜索
# --------------------------------------

search:
  # 选择: algolia_search / local_search / docsearch
  # 如果你不需要搜索，请留空
  use:
  placeholder:

  # Algolia 搜索
  algolia_search:
    # 每页搜索结果数量
    hitsPerPage: 6

  # 本地搜索
  local_search:
    # 页面加载时预加载搜索数据。
    preload: false
    # 每篇文章显示前 n 个结果，设置为 -1 显示全部结果
    top_n_per_article: 1
    # 反转义 html 字符串使其可读。
    unescape: false
    # 为搜索结果启用分页
    pagination:
      enable: false
      # 每页搜索结果数量
      hitsPerPage: 8
    CDN:

  # Docsearch
  # https://docsearch.algolia.com/
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# 分享系统
# --------------------------------------

share:
  # 选择: sharejs / addtoany
  # 如果你不需要分享，请留空
  use: 

  # Share.js
  # https://github.com/overtrue/share.js
  sharejs:
    sites: facebook,x,wechat,weibo,qq

  # AddToAny
  # https://www.addtoany.com/
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# --------------------------------------
# 评论系统
# --------------------------------------

comments:
  # 最多两个评论系统，第一个将作为默认显示
  # 如果你不需要评论，请留空
  # 选择: Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
  # 两个评论系统的格式 : Disqus,Waline
  use:
  # 在按钮旁边显示评论名称
  text: true
  # 懒加载: 当评论元素进入浏览器视口时加载评论系统。
  # 如果你将其设置为 true，评论数将无效
  lazyload: false
  # 在文章的 top_img 中显示评论数
  count: false
  # 在首页显示评论数
  card_post_count: false

# Disqus
# https://disqus.com/
disqus:
  shortname:
  # 用于最新评论小部件
  apikey:

# 替代 Disqus - 使用 Disqus API 渲染评论
# https://github.com/SukkaW/DisqusJS
disqusjs:
  shortname:
  apikey:
  option:

# Livere
# https://www.livere.com/
livere:
  uid:

# Gitalk
# https://github.com/gitalk/gitalk
gitalk:
  client_id:
  client_secret:
  repo:
  owner:
  admin:
  option:

# Valine
# https://valine.js.org
valine:
  appId:
  appKey:
  avatar: monsterid
  # 此配置适用于国内自定义域名用户，海外版本将自动检测 (无需手动填写)
  serverURLs:
  bg:
  # 使用 Valine 访客数作为页面浏览量
  visitor: false
  option:

# Waline - 一个简单的评论系统，后端支持 fork 自 Valine
# https://waline.js.org/
waline:
  serverURL:
  bg:
  # 使用 Waline 页面浏览量作为页面浏览量
  pageview: false
  option:

# Utterances
# https://utteranc.es/
utterances:
  repo:
  # 问题映射: pathname/url/title/og:title
  issue_term: pathname
  # 主题: github-light/github-dark/github-dark-orange/icy-dark/dark-blue/photon-dark
  light_theme: github-light
  dark_theme: photon-dark
  js:
  option:

# Facebook 评论插件
# https://developers.facebook.com/docs/plugins/comments/
facebook_comments:
  app_id:
  # 可选
  user_id:
  pageSize: 10
  # 选择: social / time / reverse_time
  order_by: social
  lang: en_US

# Twikoo
# https://github.com/imaegoo/twikoo
twikoo:
  envId:
  region:
  # 使用 Twikoo 访客数作为页面浏览量
  visitor: false
  option:

# Giscus
# https://giscus.app/
giscus:
  repo:
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark
  js:
  option:

# Remark42
# https://remark42.com/docs/configuration/frontend/
remark42:
  host:
  siteId:
  option:

# Artalk
# https://artalk.js.org/guide/frontend/config.html
artalk:
  server:
  site:
  # 使用 Artalk 访客数作为页面浏览量
  visitor: false
  option:

# --------------------------------------
# 聊天服务
# --------------------------------------

chat:
  # 选择: chatra/tidio/crisp/knocket
  # 如果你不需要聊天，请留空
  use:
  # 聊天按钮 [推荐]
  # 它将在网站右下角创建一个按钮，并隐藏原始按钮
  rightside_button: false
  # 向上滚动时显示原始聊天按钮，向下滚动时隐藏按钮
  button_hide_show: false

# https://chatra.io/
chatra:
  id:

# https://www.tidio.com/
tidio:
  public_key:

# https://crisp.chat/en/
crisp:
  website_id:

# https://trtc.io/solutions/knocket
knocket:
  identifier:

# --------------------------------------
# 统计分析
# --------------------------------------

# https://tongji.baidu.com/web/welcome/login
baidu_analytics:

# https://analytics.google.com/analytics/web/
google_analytics:

# https://www.cloudflare.com/zh-tw/web-analytics/
cloudflare_analytics:

# https://clarity.microsoft.com/
microsoft_clarity:

# https://umami.is/
umami_analytics:
  enable: false
  # 对于自托管设置，配置 Umami 实例的主机名
  serverURL:
  script_name: script.js
  website_id:
  option:
  UV_PV:
    site_uv: false
    site_pv: false
    page_pv: false
    # Umami Cloud (API key) / self-hosted Umami (token)
    token:

# https://www.googletagmanager.com/
google_tag_manager:
  tag_id:
  # 可选
  domain:

# --------------------------------------
# 广告
# --------------------------------------

# Google Adsense
google_adsense:
  enable: false
  auto_ads: true
  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js
  client:
  enable_page_level_ads: true

# 手动插入广告
# 如果你不需要广告，请留空
ad:
  # 在首页插入广告 (每三篇文章)
  index:
  # 在侧边栏插入广告
  aside:
  # 在文章中插入广告 (分页前)
  post:

# --------------------------------------
# 验证
# --------------------------------------

site_verification:
  # - name: google-site-verification
  #   content: xxxxxx
  # - name: baidu-site-verification
  #   content: xxxxxxx

# --------------------------------------
# 美化 / 效果
# --------------------------------------

# 自定义主题颜色
# 注意: 颜色值必须使用双引号，如 "#000"，否则可能导致错误！

# theme_color:
#   enable: true
#   main: "#49B1F5"
#   paginator: "#00c4b6"
#   button_hover: "#FF7242"
#   text_selection: "#00c4b6"
#   link_color: "#99a9bf"
#   meta_color: "#858585"
#   hr_color: "#A4D8FA"
#   code_foreground: "#F47466"
#   code_background: "rgba(27, 31, 35, .05)"
#   toc_color: "#00c4b6"
#   blockquote_padding_color: "#49b1f5"
#   blockquote_background_color: "#49b1f5"
#   scrollbar_color: "#49b1f5"
#   meta_theme_color_light: "ffffff"
#   meta_theme_color_dark: "#0d0d0d"

# 分类和标签页面的用户界面设置
# 选择: index (与首页界面相同) / default (与归档页界面相同)
# 留空或填 index
category_ui:
tag_ui:

# UI 元素的圆角
rounded_corners_ui: true

# 拉伸线条，使每行宽度相等
text_align_justify: false

# 为页眉和页脚添加蒙版
mask:
  header: true
  footer: true

# 加载动画
preloader:
  enable: false
  # 来源
  # 1. fullpage-loading (全屏加载)
  # 2. pace (进度条)
  source: 1
  # pace 主题 (查看 https://codebyzach.github.io/pace/)
  pace_css_url:

# 页面过渡
enter_transitions: true

# 默认显示模式 - light (浅色，默认) / dark (深色)
display_mode: light

# 文章内容美化配置
beautify:
  enable: false
  # 指定要美化的字段 (site 或 post)
  field: post
  # 指定要用作标题前缀的图标，例如 '\f0c1'
  title_prefix_icon:
  # 指定标题前缀图标的颜色，例如 '#F47466'
  title_prefix_icon_color:

# 全局字体设置
# 除非你知道它们如何工作，否则不要修改以下设置
font:
  global_font_size:
  code_font_size:
  font_family:
  code_font_family:

# 网站标题和副标题的字体设置
blog_title_font:
  font_link:
  font_family:

# 分割线图标设置
hr_icon:
  enable: true
  # Font Awesome 图标的 Unicode 值，例如 '\3423'
  icon:
  icon_top:

# 打字机效果
# https://github.com/disjukr/activate-power-mode
activate_power_mode:
  enable: false
  colorful: true
  shake: true
  mobile: false

# 背景效果
# --------------------------------------

# 彩色丝带
# 查看: https://github.com/hustcc/ribbon.js
canvas_ribbon:
  enable: false
  # 丝带大小
  size: 150
  # 丝带透明度 (0 ~ 1)
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

# 飘动丝带
canvas_fluttering_ribbon:
  enable: false
  mobile: false

# 画布嵌套 (星空连线)
# https://github.com/hustcc/canvas-nest.js
canvas_nest:
  enable: false
  # 线条颜色，默认: '0,0,0'; RGB 值: (R,G,B)。(注意: 使用 ',' 分隔。)
  color: '0,0,255'
  # 线条透明度 (0~1)
  opacity: 0.7
  # 背景的 z-index 属性
  zIndex: -1
  # 线条数量
  count: 99
  mobile: false

# 鼠标点击效果: 烟花
fireworks:
  enable: false
  zIndex: 9999
  mobile: false

# 鼠标点击效果: 爱心符号
click_heart:
  enable: false
  mobile: false

# 鼠标点击效果: 文字
clickShowText:
  enable: false
  text:
    # - I
    # - LOVE
    # - YOU
  fontSize: 15px
  random: false
  mobile: false

# --------------------------------------
# 灯箱设置
# --------------------------------------

# 选择: fancybox / medium_zoom
# https://github.com/francoischalifour/medium-zoom
# https://fancyapps.com/fancybox/
# 如果你不需要灯箱，请留空
lightbox:

# --------------------------------------
# 标签插件设置
# --------------------------------------

# 系列
series:
  enable: false
  # 按标题或日期排序
  orderBy: 'title'
  # 排序顺序: 1 (升序), -1 (降序)
  order: 1
  number: true

# ABCJS - ABC 音乐记谱法插件
# https://github.com/paulrosen/abcjs
abcjs:
  enable: false
  per_page: true

# Mermaid 图表
# https://github.com/mermaid-js/mermaid
mermaid:
  enable: false
  # 使用代码块编写 Mermaid 图表
  code_write: false
  # 内置主题: default / forest / dark / neutral
  theme:
    light: default
    dark: dark
  # 启用“在新标签页中打开”按钮以在单独的窗口中查看图表
  open_in_new_tab: true
  # 启用图表上的缩放和平移交互
  zoom_pan: true

# chartjs 图表
# 查看 https://www.chartjs.org/docs/latest/
chartjs:
  enable: false
  # 除非你了解它们如何工作，否则不要修改。
  # 默认设置仅在未指定 MD 语法时使用。
  # 图表通用字体颜色
  fontColor:
    light: 'rgba(0, 0, 0, 0.8)'
    dark: 'rgba(255, 255, 255, 0.8)'
  # 图表通用边框颜色
  borderColor:
    light: 'rgba(0, 0, 0, 0.1)'
    dark: 'rgba(255, 255, 255, 0.2)'
  # 雷达图和极地图上刻度标签的背景颜色
  scale_ticks_backdropColor:
    light: 'transparent'
    dark: 'transparent'

# 提示块 - Bootstrap Callout
note:
  # 提示标签样式值:
  #  - simple    bs-callout 旧警告样式。默认。
  #  - modern    bs-callout 新 (v2-v3) 警告样式。
  #  - flat      带背景的扁平提示样式，类似于 Mozilla 或 StackOverflow。
  #  - disabled  禁用提示标签的所有 CSS 样式导入。
  style: flat
  icons: true
  border_radius: 3
  # 现代和扁平样式的背景偏移百分比 (modern: -12 | 12; flat: -18 | 6)。
  # 偏移也应用于标签标签变量。此选项可以在禁用提示标签的情况下使用。
  light_bg_offset: 0

# --------------------------------------
# 其他设置
# --------------------------------------

# https://github.com/MoOx/pjax
pjax:
  enable: false
  # 从 pjax 中排除指定页面，例如 '/music/'
  exclude:
    # - /xxxxxx/

# 消息提示 - Toast 通知
# https://github.com/polonel/SnackBar
# 位置: top-left / top-center / top-right / bottom-left / bottom-center / bottom-right
snackbar:
  enable: false
  position: bottom-left
  # 浅色模式和深色模式下 Toast 通知的背景颜色
  bg_light: '#49b1f5'
  bg_dark: '#1f1f1f'

# Instant.page 预加载
# https://instant.page/
instantpage: false

# 懒加载
# https://github.com/verlok/vanilla-lazyload
lazyload:
  enable: false
  # 使用浏览器原生懒加载而不是 vanilla-lazyload
  native: false
  # 指定要使用懒加载的字段 (site 或 post)
  field: site
  placeholder:
  blur: false

# PWA (渐进式 Web 应用)
# 查看 https://github.com/JLHwung/hexo-offline
# ---------------
pwa:
  enable: false
  manifest:
  apple_touch_icon:
  favicon_32_32:
  favicon_16_16:
  mask_icon:

# Open graph meta 标签
# https://hexo.io/docs/helpers#open-graph
Open_Graph_meta:
  enable: true
  option:
    # twitter_card:
    # twitter_image:
    # twitter_id:
    # twitter_site:
    # google_plus:
    # fb_admins:
    # fb_app_id:

# 结构化数据
# https://developers.google.com/search/docs/guides/intro-structured-data
structured_data:
  enable: false
  # 网站的备用名称，用于结构化数据
  # 格式: ['name1', 'name2']
  alternate_name:

# 添加浏览器厂商前缀以确保兼容性
css_prefix: true

# 注入
# 将代码插入到头部 ('</head>' 标签之前) 和底部 ('</body>' 标签之前)
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - |
      <script>
        document.addEventListener('DOMContentLoaded', function () {
          var apiPool = ["https://uapis.cn/api/v1/random/image?category=landscape", "https://uapis.cn/api/v1/random/image?category=acg", "https://t.alcy.cc/pc", "https://api.dujin.org/bing/1920.php"];
          var fallbackImg = "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=1920&auto=format&fit=crop";
          var randomApi = apiPool[Math.floor(Math.random() * apiPool.length)];
          var finalUrl = randomApi + (randomApi.includes("?") ? "&" : "?") + "t=" + Date.now();
          
          var header = document.getElementById("page-header");
          if (header) {
            header.style.backgroundImage = "url('" + finalUrl + "')";
            var imgTest = new Image();
            imgTest.src = finalUrl;
            imgTest.onerror = function () {
              header.style.backgroundImage = "url('" + fallbackImg + "')";
            };
          }
          
          var covers = document.querySelectorAll(".post-bg");
          covers.forEach(function (cover) {
            var coverUrl = randomApi + (randomApi.includes("?") ? "&" : "?") + "t=" + Date.now() + Math.random();
            cover.style.backgroundImage = "url('" + coverUrl + "')";
            var imgTest = new Image();
            imgTest.src = coverUrl;
            imgTest.onerror = function () {
              cover.style.backgroundImage = "url('" + fallbackImg + "')";
            };
          });
        });
      </script>


# CDN 设置
# 除非你知道它们如何工作，否则不要修改以下设置
CDN:
  # 内部和第三方脚本的 CDN 提供商
