name: Giscus Comment Notification
on:
  discussion_comment:
    types: [created] # 监听新评论创建事件

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send email via QQ Mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465 # SSL 加密端口
          username: ${{ secrets.QQ_EMAIL }}
          password: ${{ secrets.QQ_AUTH_CODE }}
          subject: 📬 你的博客收到了新评论！
          to: ${{ secrets.MAIL_TO }}
          from: Blog Notification <${{ secrets.QQ_EMAIL }}>
          body: |
            来自 ${{ github.event.comment.user.login }} 的新评论：

            ${{ github.event.comment.body }}

            查看详情：${{ github.event.comment.html_url }}
